# GRUB 2 boot menu for the FR_OS hybrid live image, on UEFI and BIOS
# machines alike (phase 13 and ROADMAP SEC-14, see ARCHITECTURE.md's
# "Hybrid BIOS + UEFI boot support" section).
#
# This file is copied byte-for-byte into the ISO by live-build's own
# config/includes.binary mechanism (lb_binary_includes -- a plain
# tar/untar, confirmed by reading that script; no templating). It is
# chainloaded by a tiny standalone GRUB EFI binary
# (EFI/BOOT/BOOTX64.EFI) and, on BIOS, by GRUB's core image
# (boot/grub/grub.lnx, which isolinux's default entry starts), both of
# which installer/make-hybrid-uefi-iso.sh builds at ISO-assembly time,
# after `lb build` finishes: their only embedded job is "search for
# this ISO by volume label, then configfile this real menu" --
# everything an operator would actually want to edit lives here, as
# plain text, not baked into the compiled binaries. One menu for both
# firmwares is the point: which kernel boots is decided here only.
#
# The kernel command line below is deliberately identical to the BIOS
# path's isolinux menu (config/bootloaders/isolinux/live.cfg.in's
# "boot=live config @LB_BOOTAPPEND_LIVE@" line, with auto/config's
# --bootappend-live value written out: "persistence" (keep state across
# reboots, see frfw.persistence), "live-config.nocomponents=user-setup,sudo"
# (no default live user with a known password and sudo on a router that
# runs sshd), "live-config.noautologin" (no tty1 autologin into that
# user, which would otherwise fail in a loop) and a serial console besides the screen (headless boxes);
# LB_BOOTAPPEND_FAILSAFE is config/binary's real
# "memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash
# vga=normal"): a machine booting via UEFI must get the exact same
# live-boot(7) session as one booting via BIOS. Unlike live.cfg (which
# lb_binary_syslinux regenerates from live.cfg.in, substituting
# LB_BOOTAPPEND_LIVE/LB_BOOTAPPEND_FAILSAFE at build time), this file
# has no templating step of its own -- if bootappend-live/
# bootappend-failsafe in auto/config change, this file needs the same
# edit made by hand (tests/test_installer_bootparams.py checks they match).
#
# fr_os.loader=grub-pc / grub-efi says which firmware's GRUB started
# the kernel (the kernel ignores it; it is in /proc/cmdline and the
# journal): installer/qemu-boot-test.py checks that both paths go
# through this menu. tests/test_boot_chain.py boots this file under
# BIOS and UEFI firmware in QEMU.

# The menu on the serial console too, for headless boxes. On BIOS GRUB
# draws on the screen only; UEFI firmware already copies its console to
# the serial port when it has one (OVMF does, as do server firmwares),
# and a second copy from GRUB would double every character there.
if [ "${grub_platform}" = "pc" ]; then
    serial --unit=0 --speed=115200
    terminal_input console serial
    terminal_output console serial
fi

# A kernel staged on the persistence partition (ROADMAP SEC-14,
# frfw.kernel_boot): <persistence>/fr_os-boot/staged/ holds vmlinuz,
# initrd.img and their SHA256SUMS; fr_os-boot/grubenv (a GRUB environment
# block the router writes) holds fr_os_staged (its version) and
# fr_os_state:
#
#   trial    staged, never booted   -> boot it once, as "trying"
#   good     confirmed late in boot -> boot it, as "booting"
#   trying / booting still there    -> that boot never confirmed (a panic,
#            a hang the watchdog ended, a failed health check): "failed",
#            and the image's own kernel boots, fr_os.kernel=fallback
#   failed / nothing staged         -> the image's own kernel
#
# GRUB finds the filesystem by that file -- the one the router staged to,
# also when two are labelled "persistence". Only these two variables are
# loaded from it (load_env's list),
# and the staged kernel boots only after its new state is written: a
# kernel that can't be recorded as tried is never tried, so a broken one
# can't boot over and over. Its files are checked against SHA256SUMS
# first (a torn copy, a failing stick); a missing or damaged one is a
# failure like any other. The image's kernel is always in the menu.
# fr_os.kernel= tells the router which case this boot is.
set fr_os_kernel=image
set fr_os_image=image
set fr_os_state=
set fr_os_staged=
if search --no-floppy --file /fr_os-boot/grubenv --set=fr_os_pers; then
    set fr_os_env=($fr_os_pers)/fr_os-boot/grubenv
    load_env --file "$fr_os_env" fr_os_state fr_os_staged
fi
if [ "$fr_os_state" = trial -o "$fr_os_state" = good ]; then
    if hashsum --hash sha256 --prefix ($fr_os_pers)/fr_os-boot/staged --check ($fr_os_pers)/fr_os-boot/staged/SHA256SUMS; then
        if [ "$fr_os_state" = trial ]; then
            set fr_os_state=trying
            set fr_os_kernel=trial
        else
            set fr_os_state=booting
            set fr_os_kernel=staged
        fi
    else
        set fr_os_state=failed
        set fr_os_image=fallback
    fi
    if ! save_env --file "$fr_os_env" fr_os_state; then
        set fr_os_kernel=image
        set fr_os_image=image
    fi
elif [ "$fr_os_state" = trying -o "$fr_os_state" = booting ]; then
    set fr_os_state=failed
    if save_env --file "$fr_os_env" fr_os_state; then
        set fr_os_image=fallback
    fi
fi
export fr_os_pers fr_os_kernel fr_os_image

set timeout=5
set default=0

if [ "$fr_os_kernel" != image ]; then
    menuentry "FR_OS, kernel $fr_os_staged ($fr_os_kernel)" {
        linux ($fr_os_pers)/fr_os-boot/staged/vmlinuz boot=live config persistence ip=frommedia live-config.nocomponents=user-setup,sudo live-config.noautologin console=tty0 console=ttyS0,115200n8 fr_os.loader=grub-${grub_platform} fr_os.kernel=${fr_os_kernel} panic=10
        initrd ($fr_os_pers)/fr_os-boot/staged/initrd.img
    }
fi

menuentry "FR_OS" {
    linux /live/vmlinuz boot=live config persistence ip=frommedia live-config.nocomponents=user-setup,sudo live-config.noautologin console=tty0 console=ttyS0,115200n8 fr_os.loader=grub-${grub_platform} fr_os.kernel=${fr_os_image}
    initrd /live/initrd.img
}

menuentry "FR_OS (fail-safe mode)" {
    linux /live/vmlinuz boot=live config persistence ip=frommedia live-config.nocomponents=user-setup,sudo live-config.noautologin console=tty0 console=ttyS0,115200n8 memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash vga=normal fr_os.loader=grub-${grub_platform} fr_os.kernel=${fr_os_image}
    initrd /live/initrd.img
}
