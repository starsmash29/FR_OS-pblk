# GRUB 2 UEFI boot menu for the FR_OS hybrid live image (phase 13, see
# ARCHITECTURE.md's "Hybrid BIOS + UEFI boot support" section).
#
# This file is copied byte-for-byte into the ISO by live-build's own
# config/includes.binary mechanism (lb_binary_includes -- a plain
# tar/untar, confirmed by reading that script; no templating). It is
# chainloaded by a tiny standalone GRUB EFI binary
# (EFI/BOOT/BOOTX64.EFI) that installer/make-hybrid-uefi-iso.sh builds
# at ISO-assembly time, after `lb build` finishes: that binary's only
# embedded job is "search for this ISO by volume label, then
# configfile this real menu" -- everything an operator would actually
# want to edit lives here, as plain text, not baked into the compiled
# EFI binary.
#
# The kernel command line below is deliberately identical to the BIOS
# path's isolinux menu (config/bootloaders/isolinux/live.cfg.in's
# "boot=live config" line -- LB_BOOTAPPEND_LIVE is empty in this
# project's installer/live-build/auto/config, so "config" is the whole
# of it; LB_BOOTAPPEND_FAILSAFE is config/binary's real
# "memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash
# vga=normal"): a machine booting via UEFI must get the exact same
# live-boot(7) session as one booting via BIOS. Unlike live.cfg (which
# lb_binary_syslinux regenerates from live.cfg.in, substituting
# LB_BOOTAPPEND_LIVE/LB_BOOTAPPEND_FAILSAFE at build time), this file
# has no templating step of its own -- if bootappend-live/
# bootappend-failsafe in auto/config ever stop being empty/their
# current value, this file needs the same edit made by hand.

set timeout=5
set default=0

menuentry "FR_OS (UEFI live)" {
    linux /live/vmlinuz boot=live config
    initrd /live/initrd.img
}

menuentry "FR_OS (UEFI live, fail-safe mode)" {
    linux /live/vmlinuz boot=live config memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash vga=normal
    initrd /live/initrd.img
}
