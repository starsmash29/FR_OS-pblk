# GRUB 2 boot menu for the FR_OS hybrid live image, on UEFI and BIOS
# machines alike (phase 13 and ROADMAP SEC-14, see ARCHITECTURE.md's
# "Hybrid BIOS + UEFI boot support" section).
#
# This file is copied byte-for-byte into the ISO by live-build's own
# config/includes.binary mechanism (lb_binary_includes -- a plain
# tar/untar, confirmed by reading that script; no templating). It is
# chainloaded by a tiny standalone GRUB EFI binary
# (EFI/BOOT/BOOTX64.EFI) and, on BIOS, by GRUB's core image
# (boot/grub/grub.lnx, which isolinux's default entry starts), both of
# which installer/make-hybrid-uefi-iso.sh builds at ISO-assembly time,
# after `lb build` finishes: their only embedded job is "search for
# this ISO by volume label, then configfile this real menu" --
# everything an operator would actually want to edit lives here, as
# plain text, not baked into the compiled binaries. One menu for both
# firmwares is the point: which kernel boots is decided here only.
#
# The kernel command line below is deliberately identical to the BIOS
# path's isolinux menu (config/bootloaders/isolinux/live.cfg.in's
# "boot=live config @LB_BOOTAPPEND_LIVE@" line, with auto/config's
# --bootappend-live value written out: "persistence" (keep state across
# reboots, see frfw.persistence), "live-config.nocomponents=user-setup,sudo"
# (no default live user with a known password and sudo on a router that
# runs sshd), "live-config.noautologin" (no tty1 autologin into that
# user, which would otherwise fail in a loop) and a serial console besides the screen (headless boxes);
# LB_BOOTAPPEND_FAILSAFE is config/binary's real
# "memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash
# vga=normal"): a machine booting via UEFI must get the exact same
# live-boot(7) session as one booting via BIOS. Unlike live.cfg (which
# lb_binary_syslinux regenerates from live.cfg.in, substituting
# LB_BOOTAPPEND_LIVE/LB_BOOTAPPEND_FAILSAFE at build time), this file
# has no templating step of its own -- if bootappend-live/
# bootappend-failsafe in auto/config change, this file needs the same
# edit made by hand (tests/test_installer_bootparams.py checks they match).
#
# fr_os.loader=grub-pc / grub-efi says which firmware's GRUB started
# the kernel (the kernel ignores it; it is in /proc/cmdline and the
# journal): installer/qemu-boot-test.py checks that both paths go
# through this menu. tests/test_boot_chain.py boots this file under
# BIOS and UEFI firmware in QEMU.

# The menu on the serial console too, for headless boxes. On BIOS GRUB
# draws on the screen only; UEFI firmware already copies its console to
# the serial port when it has one (OVMF does, as do server firmwares),
# and a second copy from GRUB would double every character there.
if [ "${grub_platform}" = "pc" ]; then
    serial --unit=0 --speed=115200
    terminal_input console serial
    terminal_output console serial
fi

set timeout=5
set default=0

menuentry "FR_OS" {
    linux /live/vmlinuz boot=live config persistence ip=frommedia live-config.nocomponents=user-setup,sudo live-config.noautologin console=tty0 console=ttyS0,115200n8 fr_os.loader=grub-${grub_platform}
    initrd /live/initrd.img
}

menuentry "FR_OS (fail-safe mode)" {
    linux /live/vmlinuz boot=live config persistence ip=frommedia live-config.nocomponents=user-setup,sudo live-config.noautologin console=tty0 console=ttyS0,115200n8 memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash vga=normal fr_os.loader=grub-${grub_platform}
    initrd /live/initrd.img
}
