name: Build installer ISO

# Manual only, not on every push: a full live-build run downloads and
# assembles an entire Debian system (tens of minutes, real bandwidth),
# which is wasteful to run on every commit. Trigger it explicitly from
# the Actions tab when the installer/ tree changes and you want a fresh
# ISO to test -- or with a release tag, to attach the tested ISO to that
# GitHub release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the ISO to this existing release (e.g. v0.1.0); empty = artifact only"
        required: false
        default: ""
      boot_test:
        description: "Boot the ISO in QEMU four times with BIOS and four times with UEFI before publishing it (installer/qemu-boot-test.py)"
        type: boolean
        default: true

permissions:
  contents: write  # only used by the release upload step

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the review check compares commits and tags

      - name: Adversarial review on record (security-lessons J2)
        # A release is published only after at least two different AI
        # models reviewed it and every critical/high finding is closed
        # (docs/RELEASING.md, "Before tagging"). Checked first, before
        # half an hour of building.
        if: ${{ inputs.release_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/frfw/__init__.py').read()).group(1))")
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::release_tag $RELEASE_TAG doesn't match the version in the source (v$version)"
            exit 1
          fi
          python3 scripts/check_release_review.py "$version"

      - name: Install live-build tooling
        run: |
          sudo apt-get update
          # The full list from installer/build-live-image.sh's header --
          # syslinux-common provides the ldlinux/libcom32/libutil modules
          # the isolinux bootloader directory links to.
          sudo apt-get install -y \
            live-build debootstrap xorriso squashfs-tools isolinux \
            syslinux-common syslinux-efi syslinux-utils librsvg2-bin \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools \
            debian-archive-keyring rsync \
            clang libbpf-dev  # the XDP SNI filter's program (ROADMAP P4-1)

      - name: Package and sign the source the image installs (ROADMAP SEC-15)
        # The image installs exactly this signed tarball and keeps it, so
        # a router checks its files against a signed release from its
        # first boot (frfw.integrity) -- signed here, before the ISO is
        # built, because the published SHA256SUMS can't be inside the
        # ISO it covers.
        id: source
        env:
          SIGNING_KEY: ${{ secrets.FROS_RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/frfw/__init__.py').read()).group(1))")
          # What the router's updater installs too (frfw.release_signing):
          # the tagged tree, plus the XDP SNI filter's program compiled
          # here -- a router has no compiler (ROADMAP P4-1,
          # frfw.update._install_xdp_object).
          ./scripts/build-xdp-object.sh bpf/xdp_sni_filter.c bpf/xdp_sni_filter.o
          mkdir -p signed-source
          source="frfw-${version}.tar.gz"
          git archive --format=tar.gz -o "signed-source/$source" \
            --prefix="frfw-${version}/bpf/" --add-file=bpf/xdp_sni_filter.o \
            --prefix="frfw-${version}/" HEAD
          (cd signed-source && sha256sum "$source" > SHA256SUMS)
          ./scripts/sign-sums.sh signed-source/SHA256SUMS
          echo "dir=$PWD/signed-source" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Build hybrid live/installer ISO
        run: sudo ./installer/build-live-image.sh --signed-source "${{ steps.source.outputs.dir }}"

      - name: Name the ISO, package the source
        id: iso
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/frfw/__init__.py').read()).group(1))")
          name="FR_OS-${version}-amd64.iso"
          sudo mv installer/live-build/binary.hybrid.iso "$name"
          sudo chown "$(id -u):$(id -g)" "$name"
          # The very tarball the image installed and carries.
          source="${{ steps.source.outputs.source }}"
          cp "signed-source/$source" "$source"
          sha256sum "$name" "$source" > SHA256SUMS
          {
            echo
            echo "# FR_OS ${version} -- hybrid BIOS/UEFI live image, amd64."
            echo "# Built by GitHub Actions from commit ${GITHUB_SHA} (${GITHUB_REF_NAME})."
            echo "# Verify: sha256sum -c SHA256SUMS"
          } >> SHA256SUMS
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        # A release must be signed: routers refuse an update whose
        # SHA256SUMS.sig doesn't verify (see docs/RELEASING.md).
        env:
          SIGNING_KEY: ${{ secrets.FROS_RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        # Only what a router will accept is published: the key must be one
        # this very commit ships (scripts/sign-sums.sh checks).
        run: ./scripts/sign-sums.sh SHA256SUMS

      - name: Boot test in QEMU with BIOS (four boots, persistence, first boot, webUI)
        if: ${{ inputs.boot_test }}
        run: |
          sudo apt-get install -y qemu-system-x86 ovmf
          sudo python3 installer/qemu-boot-test.py "${{ steps.iso.outputs.name }}" --kvm --workdir qemu-test

      # The same four boots from a fresh stick with UEFI firmware (OVMF):
      # both firmwares boot from the same GRUB menu (ROADMAP SEC-14).
      - name: Boot test in QEMU with UEFI
        if: ${{ inputs.boot_test }}
        run: sudo python3 installer/qemu-boot-test.py "${{ steps.iso.outputs.name }}" --kvm --uefi --workdir qemu-test-uefi

      - name: Upload QEMU logs
        if: ${{ always() && inputs.boot_test }}
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-test-logs
          path: |
            qemu-test/boot*.log
            qemu-test-uefi/boot*.log
          if-no-files-found: ignore

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: fr-os-installer
          path: |
            ${{ steps.iso.outputs.name }}
            ${{ steps.iso.outputs.source }}
            SHA256SUMS
            SHA256SUMS.sig
          if-no-files-found: warn

      - name: Attach to the release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ inputs.release_tag }}" "${{ steps.iso.outputs.name }}"
          "${{ steps.iso.outputs.source }}" SHA256SUMS SHA256SUMS.sig --clobber
