name: Build installer ISO

# Manual only, not on every push: a full live-build run downloads and
# assembles an entire Debian system (tens of minutes, real bandwidth),
# which is wasteful to run on every commit. Trigger it explicitly from
# the Actions tab when the installer/ tree changes and you want a fresh
# ISO to test -- or with a release tag, to attach the tested ISO to that
# GitHub release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the ISO to this existing release (e.g. v0.1.0); empty = artifact only"
        required: false
        default: ""
      boot_test:
        description: "Boot the ISO in QEMU three times before publishing it (installer/qemu-boot-test.py)"
        type: boolean
        default: true

permissions:
  contents: write  # only used by the release upload step

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install live-build tooling
        run: |
          sudo apt-get update
          # The full list from installer/build-live-image.sh's header --
          # syslinux-common provides the ldlinux/libcom32/libutil modules
          # the isolinux bootloader directory links to.
          sudo apt-get install -y \
            live-build debootstrap xorriso squashfs-tools isolinux \
            syslinux-common syslinux-efi syslinux-utils librsvg2-bin \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools \
            debian-archive-keyring rsync

      - name: Build hybrid live/installer ISO
        run: sudo ./installer/build-live-image.sh

      - name: Name the ISO, package the source
        id: iso
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/frfw/__init__.py').read()).group(1))")
          name="FR_OS-${version}-amd64.iso"
          sudo mv installer/live-build/binary.hybrid.iso "$name"
          sudo chown "$(id -u):$(id -g)" "$name"
          # What the router's updater installs (frfw.release_signing).
          source="frfw-${version}.tar.gz"
          git archive --format=tar.gz --prefix="frfw-${version}/" -o "$source" HEAD
          sha256sum "$name" "$source" > SHA256SUMS
          {
            echo
            echo "# FR_OS ${version} -- hybrid BIOS/UEFI live image, amd64."
            echo "# Built by GitHub Actions from commit ${GITHUB_SHA} (${GITHUB_REF_NAME})."
            echo "# Verify: sha256sum -c SHA256SUMS"
          } >> SHA256SUMS
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        # A release must be signed: routers refuse an update whose
        # SHA256SUMS.sig doesn't verify (see docs/RELEASING.md).
        env:
          SIGNING_KEY: ${{ secrets.FROS_RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            if [ -n "$RELEASE_TAG" ]; then
              echo "::error::release_tag is set but the FROS_RELEASE_SIGNING_KEY secret is not -- refusing to publish an unsigned release (docs/RELEASING.md)"
              exit 1
            fi
            echo "::notice::no FROS_RELEASE_SIGNING_KEY secret: this test build is unsigned (fine for an artifact, not for a release)"
            exit 0
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/release.key"
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/release.key" -in SHA256SUMS -out SHA256SUMS.sig
          openssl pkey -in "$RUNNER_TEMP/release.key" -pubout > "$RUNNER_TEMP/release.pub"
          rm -f "$RUNNER_TEMP/release.key"
          # Only publish what a router will accept: the key must be one
          # this very commit ships.
          python3 - "$RUNNER_TEMP/release.pub" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "src")
          from frfw.release_signing import trusted_keys, verify_signature
          pub = Path(sys.argv[1]).read_text()
          if not any(k.read_text() == pub for k in trusted_keys()):
              sys.exit("::error::the signing key's public half is not in src/frfw/release_keys/")
          print("signed by", verify_signature(Path("SHA256SUMS"), Path("SHA256SUMS.sig"), trusted_keys()).name)
          PY

      - name: Boot test in QEMU (three boots, persistence, first boot, webUI)
        if: ${{ inputs.boot_test }}
        run: |
          sudo apt-get install -y qemu-system-x86
          sudo python3 installer/qemu-boot-test.py "${{ steps.iso.outputs.name }}" --kvm --workdir qemu-test

      - name: Upload QEMU logs
        if: ${{ always() && inputs.boot_test }}
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-test-logs
          path: qemu-test/boot*.log
          if-no-files-found: ignore

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: fr-os-installer
          path: |
            ${{ steps.iso.outputs.name }}
            ${{ steps.iso.outputs.source }}
            SHA256SUMS
            SHA256SUMS.sig
          if-no-files-found: warn

      - name: Attach to the release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ inputs.release_tag }}" "${{ steps.iso.outputs.name }}"
          "${{ steps.iso.outputs.source }}" SHA256SUMS SHA256SUMS.sig --clobber
