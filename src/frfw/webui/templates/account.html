{% extends "base.html" %}
{% block title %}Account - FR_OS{% endblock %}
{% block content %}
<h1>Account</h1>
<p>Signed in as <strong>{{ username }}</strong> ({{ role }}).</p>
<div class="card allow-viewer">
  <h3>Change password</h3>
  <p class="muted">Other sessions of this account end when the password changes.</p>
  <form method="post" action="/account/password" class="allow-viewer">
    <label>Current password</label>
    <input type="password" name="current_password" required>
    <label>New password (at least 8 characters)</label>
    <input type="password" name="new_password" minlength="8" required>
    <label>Confirm new password</label>
    <input type="password" name="new_password_confirm" minlength="8" required>
    <button type="submit">Change password</button>
  </form>
</div>
{% endblock %}
