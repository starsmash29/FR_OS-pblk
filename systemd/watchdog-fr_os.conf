# The hardware watchdog (ROADMAP SEC-14), installed as
# /etc/systemd/system.conf.d/fr_os-watchdog.conf. When the machine has one
# (/dev/watchdog0), systemd keeps it fed; if the kernel hangs, the
# watchdog resets the machine within 30 s -- and a hang on a staged
# kernel's boot is then a failed trial, so GRUB falls back to the image's
# own kernel (frfw.kernel_boot). Without one, systemd does nothing here.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
