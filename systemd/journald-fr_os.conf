# Installed as /etc/systemd/journald.conf.d/fr_os.conf.
# Security-lessons K6: FR_OS logs out of the box (firewall drops,
# services), so the journal gets a size and age limit that fits a small
# router's disk instead of journald's percentage-of-the-disk default.
[Journal]
SystemMaxUse=200M
MaxRetentionSec=90day
