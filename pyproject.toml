[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frfw"
version = "0.1.0"
description = "FR_OS firewall config engine: YAML config to nftables ruleset"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
webui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[project.scripts]
firewall-cli = "frfw.cli:main"
firewall-helper = "frfw.helper.server:main"
firewall-update-helper = "frfw.helper.update_server:main"
fr-webui = "frfw.webui.server:main"
fr-xdp-sni-logger = "frfw.xdp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
