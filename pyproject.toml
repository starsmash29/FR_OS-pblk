[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frfw"
version = "0.1.0"
description = "FR_OS firewall config engine: YAML config to nftables ruleset"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
firewall-cli = "frfw.cli:main"
firewall-helper = "frfw.helper.server:main"
fr-webui-placeholder = "frfw.webui_placeholder:main"

[tool.setuptools.packages.find]
where = ["src"]
